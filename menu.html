
<!DOCTYPE html>
<html>
<head>
    <title>Food Menu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff5e6;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #d35400;
        }

        .food {
            background-color: white;
            padding: 15px;
            margin: 15px auto;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 2px 5px gray;
        }
    </style>
</head>

<body>

    <h1>Our Food Menu</h1>

    <div class="food">
        <h2>Pizza</h2>
        <p>Price: Rs. 250</p>
    </div>

    <div class="food">
        <h2>Burger</h2>
        <p>Price: Rs. 120</p>
    </div>

    <div class="food">
        <h2>Pasta</h2>
        <p>Price: Rs. 180</p>
    </div>

    <div class="food">
        <h2>Cold Coffee</h2>
        <p>Price: Rs. 120</p>
    </div>

</body>
</html>
